# CornerOps One — continuous integration.
#
# Tiers (cost-conscious):
#   - documentation-only changes do not run CI at all (paths-ignore);
#   - every code change runs "static" (typecheck, lint, unit tests, production build);
#   - "database" (migrations + integration/security suite on a throwaway
#     Postgres 17 service) runs for every change except a positively
#     classified UI/docs-only one (scripts/ci/classify-changes.ts, fail closed).
# No deployments, no secrets, read-only token, superseded runs are cancelled.

name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  push:
    branches: ["main", "feat/**", "fix/**"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

jobs:
  changes:
    name: Select test tiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.classify.outputs.database }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: classify
        name: Classify changed files (fail closed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        # No pipes into early-exiting commands: the file list is written to disk first,
        # and any failure or unknown base selects the database tier.
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files.txt"; then
            echo "database=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node --no-warnings --experimental-strip-types scripts/ci/classify-changes.ts "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

  static:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Production build
        run: npm run build
        env:
          APP_ENV: test
          APP_MODE: demo

  database:
    name: Migrations and database security suite
    needs: changes
    # Runs unless the classifier positively reported a UI/docs-only change;
    # if the classifier job itself fails, the security suite still runs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.database != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # Ownership marker required by the test-database guard (tests/support/db-safety.ts).
          POSTGRES_DB: cornerops_disposable_cluster
          LC_ALL: C.UTF-8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway service database on loopback; the suite's guard accepts only
      # cornerops_test* names on local hosts with this flag set.
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/cornerops_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Integration and security tests (disposable database)
        run: npm run test:integration
